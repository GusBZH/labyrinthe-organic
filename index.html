// ── RENDER TEXT (double newline = separator) ─────────────────
function renderText(text){
  if(!text) return null;
  const parts = text.split('\n\n');
  const out = [];
  parts.forEach((p,i)=>{
    out.push(h('span',{key:'t'+i,style:{whiteSpace:'pre-wrap'}},p));
    if(i < parts.length-1) out.push(h('hr',{key:'s'+i,className:'sep'}));
  });
  return h(Fragment,null,...out);
}

// ── GITHUB API ───────────────────────────────────────────────
async function ghGet(token){
  const r = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`,
    {headers:{Authorization:`token ${token}`,Accept:"application/vnd.github.v3+json"}});
  if(r.status===404) return {data:null,sha:null};
  if(!r.ok) throw new Error("GitHub error");
  const j = await r.json();
  return {data:JSON.parse(atob(j.content.replace(/\n/g,""))), sha:j.sha};
}
async function ghPut(token,data,sha){
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  const body = {message:"Update",content};
  if(sha) body.sha = sha;
  const r = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`,
    {method:"PUT",headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("Save error");
  return (await r.json()).content.sha;
}

// ── COMPONENTS ───────────────────────────────────────────────

// Simple editable text
function EditText({value, onChange, editMode, multiline}) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  useEffect(() => { setVal(value); }, [value]);

  if (!editMode) {
    return h('div', {style:{fontSize:'inherit',color:'inherit',lineHeight:'inherit'}}, renderText(value || ''));
  }

  if (editing) {
    if (multiline) {
      return h('textarea', {
        className: 'edit-textarea',
        value: val,
        autoFocus: true,
        onChange: e => setVal(e.target.value),
        onBlur: () => { onChange(val); setEditing(false); }
      });
    }
    return h('input', {
      className: 'edit-input',
      value: val,
      autoFocus: true,
      onChange: e => setVal(e.target.value),
      onBlur: () => { onChange(val); setEditing(false); }
    });
  }

  return h('div', {
    onDoubleClick: () => setEditing(true),
    title: 'Double-cliquer pour modifier',
    style: {cursor:'pointer', borderBottom:'1px dashed rgba(255,255,255,.2)', minHeight:16}
  }, renderText(val) || h('span', {style:{color:'#444'}}, 'Double-cliquer…'));
}

// Status dot
function StatusDot({statut, editMode, onClick}) {
  const c = SC[statut] || '#555';
  return h('div', {
    onClick: editMode ? onClick : undefined,
    title: statut,
    style: {width:10, height:10, borderRadius:'50%', background:c, border:`2px solid ${c}`,
      boxShadow:`0 0 5px ${c}44`, flexShrink:0, cursor: editMode ? 'pointer' : 'default'}
  });
}

// Popup menu
function Popup({items, onClose, style}) {
  return h('div', {className:'popup', style},
    items.map((item,i) => h('div', {
      key: i, className:'popup-item',
      onClick: () => { item.onClick(); onClose(); }
    },
      item.dot && h('div', {style:{width:8,height:8,borderRadius:'50%',background:item.dot}}),
      item.label
    ))
  );
}

// Add button
function AddBtn({onClick}) {
  return h('div', {className:'add-btn', onClick},
    h('div', {className:'add-circle'}, '+')
  );
}

// Collapsible section
function Section({title, emoji, children, defaultOpen}) {
  const [open, setOpen] = useState(defaultOpen || false);
  return h('div', {style:{marginBottom:6}},
    h('div', {
      className: `section-header ${open ? 'open' : ''}`,
      onClick: () => setOpen(!open)
    },
      h('span', {style:{fontSize:12, transform:open?'rotate(0)':'rotate(-90deg)', transition:'transform .2s', display:'inline-block', color:'#777'}}, '▼'),
      emoji && h('span', {style:{fontSize:16}}, emoji),
      h('span', {style:{flex:1, fontSize:13, fontWeight:500, color:'#ddd'}}, title)
    ),
    open && h('div', {className:'section-body'}, children)
  );
}

// Card component
function Card({item, onUpdate, onDelete, editMode, showElem, withElem, withLvl}) {
  const [showSt, setShowSt] = useState(false);
  const [showEl, setShowEl] = useState(false);
  const [showLv, setShowLv] = useState(false);
  const [showNotes, setShowNotes] = useState(false);
  const ec = item.element ? EC[item.element] : null;

  return h('div', {
    className: 'card',
    style: ec ? {background:ec.bg, borderColor:ec.br} : {}
  },
    h('div', {style:{display:'flex', gap:8, alignItems:'flex-start'}},
      editMode && h('div', {style:{display:'flex', flexDirection:'column', gap:4, alignItems:'center', flexShrink:0}},
        h('div', {style:{position:'relative'}},
          h(StatusDot, {statut:item.statut, editMode, onClick:()=>setShowSt(!showSt)}),
          showSt && h(Popup, {
            onClose:()=>setShowSt(false),
            style:{left:16, top:0},
            items: STATUTS.map(s => ({label:s, dot:SC[s], onClick:()=>onUpdate({...item, statut:s})}))
          })
        ),
        withElem && h('div', {style:{position:'relative'}},
          h('div', {onClick:()=>setShowEl(!showEl), style:{fontSize:14, cursor:'pointer'}}, ec?.em || '?'),
          showEl && h(Popup, {
            onClose:()=>setShowEl(false),
            style:{left:20, top:0},
            items: [...ELEMENTS, 'Commun'].map(el => ({
              label:`${EC[el]?.em||'⚪'} ${el}`,
              onClick:()=>onUpdate({...item, element:el})
            }))
          })
        ),
        withLvl && h('div', {style:{position:'relative'}},
          h('div', {onClick:()=>setShowLv(!showLv), style:{fontSize:10, color:'#aaa', cursor:'pointer'}},
            item.lvl?.replace('Lvl ','L')
          ),
          showLv && h(Popup, {
            onClose:()=>setShowLv(false),
            style:{left:20, top:0},
            items: LVLS.map(l => ({label:l, onClick:()=>onUpdate({...item, lvl:l})}))
          })
        )
      ),
      h('div', {style:{flex:1, minWidth:0}},
        h('div', {style:{display:'flex', justifyContent:'space-between', gap:8, marginBottom:4}},
          h('div', {style:{fontWeight:600, fontSize:13, color:'#eee', flex:1}},
            h(EditText, {value:item.nom, onChange:v=>onUpdate({...item,nom:v}), editMode})
          ),
          h('div', {style:{display:'flex', gap:6, flexShrink:0, alignItems:'center'}},
            item.cout && h('span', {style:{fontSize:11,color:'#aaa',background:'rgba(255,255,255,.07)',padding:'1px 6px',borderRadius:4}},
              h(EditText, {value:item.cout, onChange:v=>onUpdate({...item,cout:v}), editMode})
            ),
            item.limite && h('span', {style:{fontSize:11,color:'#777'}},
              h(EditText, {value:item.limite, onChange:v=>onUpdate({...item,limite:v}), editMode})
            ),
            item.lvl && !withLvl && h('span', {style:{fontSize:11,color:'#aaa',background:'rgba(255,255,255,.07)',padding:'1px 6px',borderRadius:4}}, item.lvl)
          )
        ),
        h('div', {style:{fontSize:12, color:'#bbb', lineHeight:1.6}},
          h(EditText, {value:item.effet, onChange:v=>onUpdate({...item,effet:v}), editMode, multiline:true})
        ),
        h('div', {style:{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:6}},
          h('div', {},
            !editMode && showElem && ec && h('span', {style:{
              fontSize:10, color:ec.dot, background:ec.bg, padding:'1px 6px',
              borderRadius:10, border:`1px solid ${ec.br}`
            }}, `${ec.em} ${item.element}`)
          ),
          h('div', {style:{display:'flex', alignItems:'center', gap:8}},
            h('span', {style:{fontSize:11, color:'#555'}}, `×${item.quantite||1}`),
            editMode && h('span', {onClick:()=>setShowNotes(!showNotes), style:{fontSize:10, color:'#555', cursor:'pointer'}},
              showNotes ? '▲ notes' : '▼ notes'
            ),
            editMode && h('span', {onClick:()=>onDelete(item.id), style:{fontSize:10, color:'#444', cursor:'pointer'}}, '✕')

        ),
        editMode && showNotes && h('div', {style:{marginTop:8, padding:8, background:'rgba(0,0,0,.3)', borderRadius:6, border:'1px solid #2a2a2a'}},
          h('div', {style:{fontSize:10, color:'#555', marginBottom:4}}, 'Notes'),
          h(EditText, {value:item.notes||'', onChange:v=>onUpdate({...item,notes:v}), editMode, multiline:true})

      )

// Element group
function ElemGroup({element, items, editMode, onUpdate, onDelete, onAdd, withElem}) {
  const ec = EC[element] || EC['Commun'];
  const validCount = items.filter(i => i.statut === 'Validé').length;
  const [open, setOpen] = useState(false);
  const filtered = editMode
    ? [...items].sort((a,b) => STATUTS.indexOf(a.statut) - STATUTS.indexOf(b.statut))
    : items.filter(i => i.statut === 'Validé');
  if (!editMode && filtered.length === 0) return null;

  return h('div', {style:{marginBottom:6}},
    h('div', {
      className: `elem-header ${open ? 'open' : ''}`,
      onClick: () => setOpen(!open),
      style: {background:ec.bg, border:`1px solid ${ec.br}`}
    },
      h('span', {style:{fontSize:11, transform:open?'rotate(0)':'rotate(-90deg)', transition:'transform .2s', display:'inline-block', color:ec.dot}}, '▼'),
      h('span', {style:{fontSize:14}}, ec.em),
      h('span', {style:{flex:1, fontSize:12, fontWeight:600, color:ec.dot}}, element),
      h('span', {style:{fontSize:11, background:ec.br, color:ec.dot, padding:'1px 8px', borderRadius:10, fontWeight:700}}, validCount)
    ),
    open && h('div', {className:'elem-body', style:{background:'rgba(0,0,0,.2)', border:`1px solid ${ec.br}`}},
      filtered.map(i => h(Card, {key:i.id, item:i, onUpdate, onDelete, editMode, showElem:false, withElem:withElem||false})),
      editMode && h(AddBtn, {onClick:()=>onAdd({id:uid(), nom:'Nouveau', element, statut:'Test 3', cout:'', limite:'', effet:'', quantite:1, notes:''})})
    )
  );
}

// Lvl group
function LvlGroup({lvl, items, editMode, onUpdate, onDelete, onAdd}) {
  const validCount = items.filter(i => i.statut === 'Validé').length;
  const [open, setOpen] = useState(false);
  const filtered = editMode
    ? [...items].sort((a,b) => STATUTS.indexOf(a.statut) - STATUTS.indexOf(b.statut))
    : items.filter(i => i.statut === 'Validé');
  if (!editMode && filtered.length === 0) return null;

  return h('div', {style:{marginBottom:6}},
    h('div', {
      className: `elem-header ${open ? 'open' : ''}`,
      onClick: () => setOpen(!open),
      style: {background:'rgba(255,255,255,.04)', border:'1px solid rgba(255,255,255,.1)'}
    },
      h('span', {style:{fontSize:11, transform:open?'rotate(0)':'rotate(-90deg)', transition:'transform .2s', display:'inline-block', color:'#777'}}, '▼'),
      h('span', {style:{flex:1, fontSize:12, fontWeight:600, color:'#ccc'}},
        lvl,
        h('span', {style:{fontWeight:400, color:'#666', fontSize:11}}, ` — ${LR[lvl]}`)
      ),
      h('span', {style:{fontSize:11, background:'rgba(255,255,255,.08)', color:'#aaa', padding:'1px 8px', borderRadius:10, fontWeight:700}}, validCount)
    ),
    open && h('div', {className:'elem-body', style:{background:'rgba(0,0,0,.15)', border:'1px solid rgba(255,255,255,.06)'}},
      filtered.map(i => h(Card, {key:i.id, item:i, onUpdate, onDelete, editMode, showElem:false, withLvl:editMode})),
      editMode && h(AddBtn, {onClick:()=>onAdd({id:uid(), nom:'Nom', lvl, statut:'Test 3', effet:'', quantite:1, notes:''})})
    )
  );
}

// Mode card
function ModeCard({mode, editMode, onUpdate}) {
  const [open, setOpen] = useState(false);
  return h('div', {style:{marginBottom:6}},
    h('div', {
      className: `elem-header ${open ? 'open' : ''}`,
      onClick: () => setOpen(!open),
      style: {background:'rgba(255,255,255,.04)', border:'1px solid rgba(255,255,255,.08)'}
    },
      h('span', {style:{fontSize:11, transform:open?'rotate(0)':'rotate(-90deg)', transition:'transform .2s', display:'inline-block', color:'#777'}}, '▼'),
      h('span', {style:{fontSize:14}}, mode.emoji),
      h('span', {style:{flex:1, fontSize:12, fontWeight:600, color:'#ddd'}}, mode.nom),
      h('span', {style:{fontSize:10, color:'#666'}}, mode.difficulte),
      mode.joueurs && h('span', {style:{fontSize:10, color:'#555', background:'rgba(255,255,255,.05)', padding:'1px 6px', borderRadius:6}}, `👥${mode.joueurs}`)
    ),
    open && h('div', {className:'elem-body', style:{background:'rgba(0,0,0,.15)', border:'1px solid rgba(255,255,255,.06)'}},
      h('div', {style:{fontSize:11, color:'#666', marginBottom:8}}, mode.style),
      h('div', {style:{fontSize:12, color:'#bbb', lineHeight:1.7}},
        h(EditText, {value:mode.contenu, onChange:v=>onUpdate({...mode,contenu:v}), editMode, multiline:true})
      ),
      editMode && h('div', {style:{marginTop:10, padding:8, background:'rgba(0,0,0,.3)', borderRadius:6, border:'1px solid #2a2a2a'}},
        h('div', {style:{fontSize:10, color:'#555', marginBottom:4}}, 'Notes de test'),
        h(EditText, {value:mode.notes||'', onChange:v=>onUpdate({...mode,notes:v}), editMode, multiline:true})
      ),
      !editMode && mode.notes && h('div', {style:{marginTop:10, padding:8, background:'rgba(0,0,0,.2)', borderRadius:6, borderLeft:'2px solid #333'}},
        h('div', {style:{fontSize:10, color:'#555', marginBottom:4}}, '📝 Notes'),
        h('div', {style:{fontSize:11, color:'#888'}}, renderText(mode.notes))
      )
    )
  );
}

function NotesBlock({value, onChange, editMode, label}) {
  if (!editMode) return null;
  return h('div', {style:{marginTop:8, padding:8, background:'rgba(0,0,0,.3)', borderRadius:6, border:'1px solid #2a2a2a'}},
    h('div', {style:{fontSize:10, color:'#555', marginBottom:4}}, label || 'Notes globales'),
    h(EditText, {value:value||'', onChange, editMode, multiline:true})
  );
}

// Pages
function SoireePage({soirees, onUpdate, onAdd, onDelete, editMode, onBack}) {
  return h('div', {style:{padding:'0 16px 80px'}},
    h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'16px 0'}},
      h('button', {onClick:onBack, style:{background:'none', border:'1px solid #333', borderRadius:6, color:'#aaa', padding:'6px 12px', fontSize:12}}, '← Retour'),
      h('h2', {style:{margin:0, fontSize:16, color:'#eee'}}, '📅 Soirées Proto')
    ),
    soirees.map(s => h(Section, {key:s.id, title:s.date||'Sans date', emoji:'📅'},
      h('div', {style:{marginBottom:8}},
        h('div', {style:{fontSize:10, color:'#555', marginBottom:4}}, 'Participants & lieu'),
        editMode
          ? h(EditText, {value:s.meta||'', onChange:v=>onUpdate({...s,meta:v}), editMode, multiline:true})
          : h('div', {style:{fontSize:12, color:'#bbb'}}, renderText(s.meta||''))
      ),
      h('hr', {className:'sep'}),
      h('div', {style:{fontSize:10, color:'#555', marginBottom:4}}, 'Notes'),
      editMode
        ? h(EditText, {value:s.notes||'', onChange:v=>onUpdate({...s,notes:v}), editMode, multiline:true})
        : h('div', {style:{fontSize:12, color:'#bbb'}}, renderText(s.notes||'')),
      editMode && h('div', {style:{marginTop:8, textAlign:'right'}},
        h('button', {onClick:()=>onDelete(s.id), style:{background:'none', border:'1px solid #333', borderRadius:4, color:'#666', padding:'2px 8px', fontSize:11}}, 'Supprimer')
      )
    )),
    h(AddBtn, {onClick:()=>onAdd({id:uid(), date:new Date().toLocaleDateString('fr-FR'), meta:'', notes:''})})
  );
}

function IdeeVracPage({value, onChange, editMode, onBack}) {
  return h('div', {style:{padding:'0 16px 80px'}},
    h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'16px 0'}},
      h('button', {onClick:onBack, style:{background:'none', border:'1px solid #333', borderRadius:6, color:'#aaa', padding:'6px 12px', fontSize:12}}, '← Retour'),
      h('h2', {style:{margin:0, fontSize:16, color:'#eee'}}, '💡 Idées en vrac')
    ),
    h('p', {style:{fontSize:11, color:'#555', marginBottom:8}}, 'Double retour à la ligne = séparateur ────'),
    editMode
      ? h('textarea', {
          value, onChange:e=>onChange(e.target.value),
          placeholder:'Tes idées ici...',
          style:{width:'100%', minHeight:'65vh', background:'rgba(255,255,255,.03)', border:'1px solid #333',
            borderRadius:8, color:'#ddd', padding:12, fontFamily:'inherit', fontSize:13, lineHeight:1.7,
            resize:'vertical', boxSizing:'border-box'}
        })
      : h('div', {style:{fontSize:13, color:'#bbb', lineHeight:1.7}}, renderText(value||''))
  );
}

// ── MAIN APP ─────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(null);
  const [sha, setSha] = useState(null);
  const [token, setToken] = useState(() => { try { return localStorage.getItem('gh_token')||''; } catch { return ''; } });
  const [tokenInput, setTokenInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [saveErr, setSaveErr] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [page, setPage] = useState('home');
  const saveTimer = useRef(null);
  const shaRef = useRef(null);

  useEffect(() => { shaRef.current = sha; }, [sha]);

  useEffect(() => {
    if (!token) return;
    setLoading(true); setSaveErr(null);
    ghGet(token).then(({data:d, sha:s}) => {
      setData(d || INIT); setSha(s); shaRef.current = s; setLoading(false);
    }).catch(() => {
      setData(INIT); setLoading(false);
      setSaveErr('Mode local — GitHub non disponible');
    });
  }, [token]);

  const save = useCallback((nd) => {
    if (!token) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSaving(true); setSaveErr(null);
      try { const s = await ghPut(token, nd, shaRef.current); setSha(s); shaRef.current = s; }
      catch(e) { setSaveErr('Sauvegarde échouée'); }
      setSaving(false);
    }, 2000);
  }, [token]);

  const upd = useCallback((nd) => { setData(nd); save(nd); }, [save]);
  const updArr = (key, item) => upd({...data, [key]: data[key].map(i => i.id === item.id ? item : i)});
  const delArr = (key, id) => upd({...data, [key]: data[key].filter(i => i.id !== id)});
  const addArr = (key, item) => upd({...data, [key]: [...data[key], item]});

  // TOKEN SCREEN
  if (!data && !loading) {
    return h('div', {style:{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:24}},
      h('div', {style:{maxWidth:340, width:'100%', textAlign:'center'}},
        h('div', {style:{fontSize:40, marginBottom:16}}, '🎲'),
        h('h1', {style:{color:'#eee', fontSize:20, marginBottom:8}}, 'Labyrinthe Organic'),
        h('p', {style:{color:'#666', fontSize:13, marginBottom:20}}, 'Entre ton token GitHub, ou continue sans token.'),
        h('input', {
          type:'password', value:tokenInput, autoFocus:true,
          onChange:e=>setTokenInput(e.target.value),
          onKeyDown:e=>{ if(e.key==='Enter'&&tokenInput){try{localStorage.setItem('gh_token',tokenInput);}catch{}setToken(tokenInput);} },
          placeholder:'ghp_...',
          style:{width:'100%', background:'rgba(255,255,255,.05)', border:'1px solid #333', borderRadius:8, color:'#eee', padding:'10px 14px', fontSize:14, boxSizing:'border-box', marginBottom:10}
        }),
        h('button', {
          onClick:()=>{ if(tokenInput){try{localStorage.setItem('gh_token',tokenInput);}catch{}setToken(tokenInput);} },
          style:{width:'100%', background:'#222', border:'1px solid #444', borderRadius:8, color:'#eee', padding:'10px 14px', fontSize:14, marginBottom:8}
        }, 'Connexion GitHub'),
        h('button', {
          onClick:()=>setData(INIT),
          style:{width:'100%', background:'none', border:'1px solid #2a2a2a', borderRadius:8, color:'#666', padding:'8px 14px', fontSize:12}
        }, 'Continuer sans token (mode local)')
      )
    );
  }

  if (loading) return h('div', {style:{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:'#555'}}, 'Chargement...');
  if (!data) return null;

  // PAGES
  if (page === 'soirees') return h('div', {style:{minHeight:'100vh'}},
    h(SoireePage, {
      soirees:data.soireesProto, editMode, onBack:()=>setPage('home'),
      onUpdate:s=>updArr('soireesProto',s),
      onAdd:s=>addArr('soireesProto',s),
      onDelete:id=>delArr('soireesProto',id)
    })
  );

  if (page === 'idees') return h('div', {style:{minHeight:'100vh'}},
    h(IdeeVracPage, {value:data.ideeEnVrac, onChange:v=>upd({...data,ideeEnVrac:v}), editMode, onBack:()=>setPage('home')})
  );

  // HOME
  const sortsByEl = {};
  ELEMENTS.forEach(el => { sortsByEl[el] = data.sorts.filter(s => s.element === el); });
  const energElems = ['Commun', ...ELEMENTS];
  const energsByEl = {};
  energElems.forEach(el => { energsByEl[el] = data.energies.filter(e => e.element === el); });
  const monsByLvl = {};
  LVLS.forEach(l => { monsByLvl[l] = data.monstres.filter(m => m.lvl === l); });

  const reglesF = editMode
    ? [...data.regles].sort((a,b) => STATUTS.indexOf(a.statut) - STATUTS.indexOf(b.statut))
    : data.regles.filter(r => r.statut === 'Validé');
  const casesF = editMode
    ? [...data.cases].sort((a,b) => STATUTS.indexOf(a.statut) - STATUTS.indexOf(b.statut))
    : data.cases.filter(c => c.statut === 'Validé');

  const VISUEL_CATS = [
    {key:'general',label:'💡 Idée générale'},{key:'boite',label:'📦 Boîte'},
    {key:'personnages',label:'🧑 Personnages'},{key:'cases',label:'🗺️ Cases'},
    {key:'items',label:'💎 Items'},{key:'monstres',label:'👹 Monstres'},
    {key:'accessoires',label:'🎲 Accessoires'},{key:'references',label:'🎨 Références'},
  ];

  const bgStyle = editMode
    ? {background:'repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(255,255,255,.04) 27px,rgba(255,255,255,.04) 28px),repeating-linear-gradient(90deg,transparent,transparent 27px,rgba(255,255,255,.04) 27px,rgba(255,255,255,.04) 28px),#1a1a1a'}
    : {background:'#0e0e0e'};

  return h('div', {style:{minHeight:'100vh', fontFamily:'-apple-system,BlinkMacSystemFont,sans-serif', color:'#eee', transition:'background .5s', ...bgStyle}},

    // HEADER
    h('div', {style:{position:'sticky', top:0, zIndex:50,
      background:editMode?'rgba(25,25,25,.97)':'rgba(14,14,14,.97)',
      backdropFilter:'blur(10px)', borderBottom:'1px solid rgba(255,255,255,.06)',
      padding:'10px 16px', display:'flex', alignItems:'center', justifyContent:'space-between'}},
      h('div', {style:{flex:1, minWidth:0}},
        h('div', {style:{fontSize:15, fontWeight:700, color:'#eee'}},
          h(EditText, {value:data.gameName, onChange:v=>upd({...data,gameName:v}), editMode})
        ),
        h('div', {style:{fontSize:10, marginTop:1, color:saveErr?'#f55':saving?'#888':'transparent', minHeight:14}},
          saveErr || (saving ? 'Sauvegarde...' : '')
        )
      ),
      h('button', {
        onClick:()=>setEditMode(!editMode),
        style:{background:editMode?'rgba(255,255,255,.1)':'none',
          border:`1px solid ${editMode?'rgba(255,255,255,.3)':'#333'}`,
          borderRadius:8, padding:'6px 10px', color:editMode?'#eee':'#555', fontSize:16, transition:'all .2s'}
      }, '✏️')
    ),

    // CONTENT
    h('div', {style:{padding:'16px 16px 100px'}},

      // WIP JOUER
      h('div', {style:{background:'rgba(255,255,255,.06)', border:'1px solid rgba(255,255,255,.12)',
        borderRadius:12, padding:16, marginBottom:20, textAlign:'center', cursor:'not-allowed'}},
        h('div', {style:{fontSize:14, fontWeight:600, color:'#777'}}, '🎮 Jouer'),
        h('div', {style:{fontSize:11, color:'#555', marginTop:4}}, 'WIP — bientôt disponible')
      ),

      // RÈGLES
      h(Section, {title:'Règles de base', emoji:'📋'},
        reglesF.map(r => h(Card, {key:r.id, item:r, onUpdate:i=>updArr('regles',i), onDelete:id=>delArr('regles',id), editMode, showElem:false})),
        editMode && h(AddBtn, {onClick:()=>addArr('regles',{id:uid(),nom:'Nouvelle règle',statut:'Test 3',effet:'',notes:''})}),
        h(NotesBlock, {value:data.reglesNotes, onChange:v=>upd({...data,reglesNotes:v}), editMode, label:'Notes — Règles'})
      ),

      // CASES
      h(Section, {title:'Cases', emoji:'🗺️'},
        casesF.map(c => h(Card, {key:c.id, item:c, onUpdate:i=>updArr('cases',i), onDelete:id=>delArr('cases',id), editMode, showElem:false})),
        editMode && h(AddBtn, {onClick:()=>addArr('cases',{id:uid(),nom:'Nouvelle case',statut:'Test 3',effet:'',quantite:1,notes:''})})
      ),

      // SORTS
      h(Section, {title:'Sorts', emoji:'💎'},
        ELEMENTS.map(el => h(ElemGroup, {key:el, element:el, items:sortsByEl[el]||[], editMode, withElem:true,
          onUpdate:i=>updArr('sorts',i), onDelete:id=>delArr('sorts',id),
          onAdd:i=>addArr('sorts',i)
        })),
        h(NotesBlock, {value:data.sortsNotes, onChange:v=>upd({...data,sortsNotes:v}), editMode, label:'Notes — Sorts'})
      ),

      // ÉNERGIES
      h(Section, {title:'Énergies', emoji:'✨'},
        energElems.map(el => h(ElemGroup, {key:el, element:el, items:energsByEl[el]||[], editMode, withElem:false,
          onUpdate:i=>updArr('energies',i), onDelete:id=>delArr('energies',id),
          onAdd:i=>addArr('energies',{id:uid(),nom:'Nouvelle énergie',element:el,statut:'Test 3',cout:'',limite:'',effet:'',quantite:1,notes:''})
        }))
      ),

      // MONSTRES
      h(Section, {title:'Monstres', emoji:'👹'},
        LVLS.map(l => h(LvlGroup, {key:l, lvl:l, items:monsByLvl[l]||[], editMode,
          onUpdate:i=>updArr('monstres',i), onDelete:id=>delArr('monstres',id),
          onAdd:i=>addArr('monstres',i)
        })),
        h(NotesBlock, {value:data.monstresNotes, onChange:v=>upd({...data,monstresNotes:v}), editMode, label:'Notes — Monstres'})
      ),

      // LEXIQUE
      h(Section, {title:'Lexique', emoji:'📖'},
        data.lexique.map((l,i) => h('div', {key:l.id, style:{padding:'8px 0',
          borderBottom:i<data.lexique.length-1?'1px solid rgba(255,255,255,.06)':'none',
          display:'flex', gap:8}},
          h('div', {style:{minWidth:120, fontSize:12, fontWeight:600, color:'#ccc', flexShrink:0}},
            h(EditText, {value:l.terme, onChange:v=>{const a=data.lexique.map(x=>x.id===l.id?{...x,terme:v}:x);upd({...data,lexique:a});}, editMode})
          ),
          h('div', {style:{fontSize:12, color:'#888', flex:1}},
            h(EditText, {value:l.definition, onChange:v=>{const a=data.lexique.map(x=>x.id===l.id?{...x,definition:v}:x);upd({...data,lexique:a});}, editMode, multiline:true})
          )
        )),
        editMode && h(AddBtn, {onClick:()=>upd({...data,lexique:[...data.lexique,{id:uid(),terme:'Terme',definition:'Définition'}]})}),
        h(NotesBlock, {value:data.lexiqueNotes, onChange:v=>upd({...data,lexiqueNotes:v}), editMode})
      ),

      // MODES
      h(Section, {title:'Modes de jeu', emoji:'🎮'},
        data.modes.map(m => h(ModeCard, {key:m.id, mode:m, editMode,
          onUpdate:m2=>{const a=data.modes.map(x=>x.id===m2.id?m2:x);upd({...data,modes:a});}
        })),
        editMode && h(AddBtn, {onClick:()=>upd({...data,modes:[...data.modes,{id:uid(),nom:'Nouveau mode',emoji:'🎲',difficulte:'⭐',style:'',joueurs:'',contenu:'',notes:''}]})}),
        h('div', {style:{marginTop:8, borderTop:'1px solid rgba(255,255,255,.06)', paddingTop:8}},
          h('div', {style:{fontSize:11, color:'#555', marginBottom:8}}, '💡 Idées de modes'),
          data.ideesModes.map(im => h('div', {key:im.id, style:{background:'rgba(255,255,255,.03)', border:'1px solid rgba(255,255,255,.07)', borderRadius:6, padding:'8px 10px', marginBottom:6}},
            h('div', {style:{fontSize:12, fontWeight:600, color:'#ccc', marginBottom:4}},
              h(EditText, {value:im.nom, onChange:v=>{const a=data.ideesModes.map(x=>x.id===im.id?{...x,nom:v}:x);upd({...data,ideesModes:a});}, editMode})
            ),
            h('div', {style:{fontSize:12, color:'#777'}},
              h(EditText, {value:im.pitch, onChange:v=>{const a=data.ideesModes.map(x=>x.id===im.id?{...x,pitch:v}:x);upd({...data,ideesModes:a});}, editMode, multiline:true})
            )
          )),
          editMode && h(AddBtn, {onClick:()=>upd({...data,ideesModes:[...data.ideesModes,{id:uid(),nom:'Nouveau mode',pitch:''}]})})
        )
      ),

      // VISUELS
      h(Section, {title:'Visuels', emoji:'🎨'},
        VISUEL_CATS.map(cat => h(Section, {key:cat.key, title:cat.label, emoji:''},
          h('div', {style:{fontSize:12, color:'#bbb', lineHeight:1.7}},
            h(EditText, {value:data.visuels[cat.key]||'', onChange:v=>upd({...data,visuels:{...data.visuels,[cat.key]:v}}), editMode, multiline:true})
          )
        ))
      ),

      // MATÉRIEL
      h(Section, {title:'Matériel', emoji:'🧰'},
        h('div', {style:{fontSize:12, color:'#bbb', lineHeight:1.7}},
          h(EditText, {value:data.materiel, onChange:v=>upd({...data,materiel:v}), editMode, multiline:true})
        ),
        h(NotesBlock, {value:data.materielNotes, onChange:v=>upd({...data,materielNotes:v}), editMode})
      ),

      // BOUTONS BAS
      h('div', {style:{display:'flex', flexDirection:'column', gap:8, marginTop:20}},
        h('button', {className:'btn-main', onClick:()=>setPage('soirees')}, '📅 Soirées Prototype'),
        h('button', {className:'btn-main', onClick:()=>setPage('idees')}, '💡 Idées en vrac'),
        h('button', {
          onClick:()=>{try{localStorage.removeItem('gh_token');}catch{}setToken('');setData(null);},
          style:{width:'100%', background:'none', border:'1px solid #222', borderRadius:10, padding:10, color:'#444', fontSize:12, marginTop:8}
        }, 'Déconnexion')
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
</script>
</body>
</html>
