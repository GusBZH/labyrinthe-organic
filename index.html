<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Labyrinthe Organic</title>
<meta name="theme-color" content="#0e0e0e"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e0e;color:#eee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
button,input,textarea{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.section-header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;cursor:pointer;user-select:none;transition:background .15s}
.section-header:hover{background:rgba(255,255,255,.07)}
.section-header.open{border-radius:8px 8px 0 0}
.section-body{padding:12px 14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-top:none;border-radius:0 0 8px 8px}
.card{border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
.elem-header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;user-select:none}
.elem-header.open{border-radius:6px 6px 0 0}
.elem-body{padding:10px;border-top:none;border-radius:0 0 6px 6px}
.add-btn{display:flex;justify-content:center;align-items:center;height:40px;cursor:pointer;opacity:.4;transition:opacity .2s;margin-top:4px}
.add-btn:hover{opacity:1}
.add-circle{width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:#000;font-weight:700;line-height:1}
.btn-main{width:100%;border-radius:10px;padding:14px;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#ccc}
.btn-main:hover{background:rgba(255,255,255,.07)}
.popup{position:absolute;z-index:300;background:#1c1c1c;border:1px solid #333;border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.8);min-width:130px}
.popup-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px}
.popup-item:hover{background:rgba(255,255,255,.08)}
.sep{border:none;border-top:1px solid rgba(255,255,255,.15);margin:8px 0}
.edit-input{background:rgba(255,255,255,.06);border:1px solid #444;border-radius:4px;color:#eee;padding:4px 6px;width:100%;font-size:inherit;line-height:inherit}
.edit-textarea{background:rgba(255,255,255,.06);border:1px solid #444;border-radius:4px;color:#eee;padding:4px 6px;width:100%;font-size:inherit;resize:vertical;min-height:60px}
.gridflash-in::after, .gridflash-out::after{
  content:'';
  position:absolute;inset:0;z-index:5;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(160,210,255,.9) 27px,rgba(160,210,255,.9) 28px),
    repeating-linear-gradient(90deg,transparent,transparent 27px,rgba(160,210,255,.9) 27px,rgba(160,210,255,.9) 28px);
  filter:drop-shadow(0 0 3px rgba(140,190,255,.9)) drop-shadow(0 0 9px rgba(100,160,255,.6));
  opacity:0;
}
.gridflash-in::after{ animation:editGridFlashIn .4s both; }
.gridflash-out::after{ animation:editGridFlashOut .576s both; }
@keyframes editGridFlashIn{
  0%   {opacity:0; animation-timing-function:ease-out;}
  25%  {opacity:.33; animation-timing-function:ease-in;}
  100% {opacity:0;}
}
@keyframes editGridFlashOut{
  0%     {opacity:.33; animation-timing-function:steps(1,end);}
  8.33%  {opacity:0; animation-timing-function:steps(1,end);}
  47.22% {opacity:.33; animation-timing-function:steps(1,end);}
  54.17% {opacity:0; animation-timing-function:steps(1,end);}
  65.28% {opacity:.33;}
  100%   {opacity:0;}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
