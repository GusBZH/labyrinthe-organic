// ── GITHUB API ───────────────────────────────────────────────
async function ghGet(token){
  const r=await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
    {headers:{Authorization:`token ${token}`,Accept:"application/vnd.github.v3+json"}});
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw new Error("Erreur GitHub");
  const j=await r.json();
  return{data:JSON.parse(atob(j.content.replace(/\n/g,""))),sha:j.sha};
}
async function ghPut(token,data,sha){
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  const body={message:"Update",content};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
    {method:"PUT",headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("Erreur sauvegarde");
  return(await r.json()).content.sha;
}

// ── COMPONENTS ───────────────────────────────────────────────

function Separator(){
  return <hr style={{border:"none",borderTop:"1px solid rgba(255,255,255,0.12)",margin:"8px 0"}}/>;
}

function renderText(text){
  if(!text)return null;
  const parts=text.split(/\n\n---\n\n|\n---\n/);
  return parts.map((p,i)=>(
    <React.Fragment key={i}>
      <span style={{whiteSpace:"pre-wrap"}}>{p}</span>
      {i<parts.length-1&&<Separator/>}
    </React.Fragment>
  ));
}

function EditText({value,onChange,editMode,multiline,style={}}){
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(value);
  useEffect(()=>setVal(value),[value]);
  if(!editMode)return <span style={{whiteSpace:"pre-wrap",...style}}>{renderText(value)}</span>;
  if(editing){
    const s={background:"rgba(255,255,255,0.06)",border:"1px solid #444",borderRadius:4,
      color:"#eee",padding:"4px 6px",width:"100%",fontFamily:"inherit",
      fontSize:"inherit",lineHeight:"inherit",...style};
    return multiline
      ?<textarea value={val} autoFocus rows={3} onChange={e=>setVal(e.target.value)}
          onBlur={()=>{onChange(val);setEditing(false);}} style={{...s,resize:"vertical"}}/>
      :<input value={val} autoFocus onChange={e=>setVal(e.target.value)}
          onBlur={()=>{onChange(val);setEditing(false);}} style={s}/>;
  }
  return(
    <span onDoubleClick={()=>setEditing(true)}
      style={{cursor:"pointer",borderBottom:"1px dashed rgba(255,255,255,0.2)",...style}}
      title="Double-cliquer pour modifier">
      {renderText(val)||<span style={{color:"#444"}}>Double-cliquer pour modifier</span>}
    </span>
  );
}

          transition:"transform .2s",display:"inline-block",color:"#777"}}>▼</span>
        <span style={{fontSize:14}}>{mode.emoji}</span>
        <span style={{flex:1,fontSize:12,fontWeight:600,color:"#ddd"}}>{mode.nom}</span>
        {mode.difficulte&&<span style={{fontSize:10,color:"#666"}}>{mode.difficulte}</span>}
      </div>
      {open&&(
        <div style={{padding:12,background:"rgba(0,0,0,.15)",
          border:"1px solid rgba(255,255,255,.06)",borderTop:"none",borderRadius:"0 0 6px 6px"}}>
          {mode.joueurs&&<div style={{fontSize:11,color:"#666",marginBottom:8}}>👥 {mode.joueurs} · {mode.style}</div>}
          <div style={{fontSize:12,color:"#bbb",lineHeight:1.7}}>
            <EditText value={mode.contenu} onChange={v=>onUpdate({...mode,contenu:v})} editMode={editMode} multiline/>
          </div>
          {editMode&&(
            <div style={{marginTop:10,padding:8,background:"rgba(0,0,0,.3)",borderRadius:6,border:"1px solid #2a2a2a"}}>
              <div style={{fontSize:10,color:"#555",marginBottom:4}}>Notes de test</div>
              <EditText value={mode.notes||""} onChange={v=>onUpdate({...mode,notes:v})} editMode={editMode} multiline style={{fontSize:11,color:"#999"}}/>
            </div>
          )}
          {!editMode&&mode.notes&&(
            <div style={{marginTop:10,padding:8,background:"rgba(0,0,0,.2)",borderRadius:6,borderLeft:"2px solid #333"}}>
              <div style={{fontSize:10,color:"#555",marginBottom:4}}>📝 Notes</div>
              <div style={{fontSize:11,color:"#888",whiteSpace:"pre-wrap"}}>{renderText(mode.notes)}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function NotesBlock({value,onChange,editMode,label}){
  if(!editMode)return null;
  return(
    <div style={{marginTop:8,padding:8,background:"rgba(0,0,0,.3)",borderRadius:6,border:"1px solid #2a2a2a"}}>
      <div style={{fontSize:10,color:"#555",marginBottom:4}}>{label||"Notes globales"}</div>
      <EditText value={value||""} onChange={onChange} editMode={editMode} multiline style={{fontSize:11,color:"#999",display:"block",width:"100%"}}/>
    </div>
  );
}

// ── PAGES ────────────────────────────────────────────────────
function SoireePage({soirees,onUpdate,onAdd,onDelete,editMode,onBack}){
  const sorted=[...soirees].sort((a,b)=>new Date(b.date)-new Date(a.date));
  return(
    <div style={{padding:"0 16px 80px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"16px 0"}}>
        <button onClick={onBack} style={{background:"none",border:"1px solid #333",borderRadius:6,color:"#aaa",padding:"6px 12px",fontSize:12}}>← Retour</button>
        <h2 style={{margin:0,fontSize:16,color:"#eee"}}>📅 Soirées Proto</h2>
      </div>
      {sorted.map(s=>(
        <Section key={s.id} title={s.date||"Sans date"} emoji="📅">
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:"#555",marginBottom:4}}>Participants & lieu</div>
            {editMode
              ?<EditText value={s.meta||""} onChange={v=>onUpdate({...s,meta:v})} editMode={editMode} multiline/>
              :<div style={{fontSize:12,color:"#bbb"}}>{renderText(s.meta||"")}</div>}
          </div>
          <Separator/>
          <div style={{fontSize:10,color:"#555",marginBottom:4}}>Notes</div>
          {editMode
            ?<EditText value={s.notes||""} onChange={v=>onUpdate({...s,notes:v})} editMode={editMode} multiline/>
            :<div style={{fontSize:12,color:"#bbb",whiteSpace:"pre-wrap"}}>{renderText(s.notes||"")}</div>}
          {editMode&&<div style={{marginTop:8,textAlign:"right"}}>
            <button onClick={()=>onDelete(s.id)} style={{background:"none",border:"1px solid #333",borderRadius:4,color:"#666",padding:"2px 8px",fontSize:11}}>Supprimer</button>
          </div>}
        </Section>
      ))}
      <AddBtn onClick={()=>onAdd({id:uid(),date:new Date().toLocaleDateString("fr-FR"),meta:"",notes:""})}/>
    </div>
  );
}

function IdeeVracPage({value,onChange,editMode,onBack}){
  return(
    <div style={{padding:"0 16px 80px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"16px 0"}}>
        <button onClick={onBack} style={{background:"none",border:"1px solid #333",borderRadius:6,color:"#aaa",padding:"6px 12px",fontSize:12}}>← Retour</button>
        <h2 style={{margin:0,fontSize:16,color:"#eee"}}>💡 Idées en vrac</h2>
      </div>
      <textarea value={value} onChange={e=>onChange(e.target.value)}
        placeholder="Tes idées ici... Double retour à la ligne + --- crée un séparateur."
        style={{width:"100%",minHeight:"65vh",background:"rgba(255,255,255,.03)",
          border:"1px solid #333",borderRadius:8,color:"#ddd",padding:12,
          fontFamily:"inherit",fontSize:13,lineHeight:1.7,resize:"vertical",boxSizing:"border-box"}}/>
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(null);
  const [sha,setSha]=useState(null);
  const [token,setToken]=useState(()=>localStorage.getItem("gh_token")||"");
  const [tokenInput,setTokenInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [saving,setSaving]=useState(false);
  const [saveErr,setSaveErr]=useState(null);
  const [editMode,setEditMode]=useState(false);
  const [page,setPage]=useState("home");
  const saveTimer=useRef(null);
  const shaRef=useRef(sha);
  useEffect(()=>{shaRef.current=sha;},[sha]);

  useEffect(()=>{
    if(!token)return;
    setLoading(true);
    ghGet(token).then(({data:d,sha:s})=>{
      setData(d||INIT);setSha(s);setLoading(false);
    }).catch(e=>{setSaveErr(e.message);setLoading(false);setData(INIT);});
  },[token]);

  const save=useCallback((nd)=>{
    if(!token)return;
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      setSaving(true);setSaveErr(null);
      try{const s=await ghPut(token,nd,shaRef.current);setSha(s);shaRef.current=s;}
      catch(e){setSaveErr("Sauvegarde échouée");}
      setSaving(false);
    },2000);
  },[token]);

  const upd=useCallback((nd)=>{setData(nd);save(nd);},[save]);

  const updArr=(key,item)=>upd({...data,[key]:data[key].map(i=>i.id===item.id?item:i)});
  const delArr=(key,id)=>upd({...data,[key]:data[key].filter(i=>i.id!==id)});
  const addArr=(key,item)=>upd({...data,[key]:[...data[key],item]});

  if(!token){
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
        <div style={{maxWidth:340,width:"100%",textAlign:"center"}}>
          <div style={{fontSize:40,marginBottom:16}}>🎲</div>
          <h1 style={{color:"#eee",fontSize:20,marginBottom:8}}>Labyrinthe Organic</h1>
          <p style={{color:"#666",fontSize:13,marginBottom:20}}>Entre ton token GitHub pour accéder à tes données.</p>
          <input type="password" value={tokenInput} onChange={e=>setTokenInput(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"){localStorage.setItem("gh_token",tokenInput);setToken(tokenInput);}}}
            placeholder="ghp_..." autoFocus
            style={{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid #333",
              borderRadius:8,color:"#eee",padding:"10px 14px",fontSize:14,boxSizing:"border-box",marginBottom:10}}/>
          <button onClick={()=>{localStorage.setItem("gh_token",tokenInput);setToken(tokenInput);}}
            style={{width:"100%",background:"#222",border:"1px solid #444",borderRadius:8,
              color:"#eee",padding:"10px 14px",fontSize:14}}>
            Connexion
          </button>
        </div>
      </div>
    );
  }

  if(loading)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#555"}}>
      Chargement...
    </div>
  );

  if(!data)return null;

  if(page==="soirees")return(
    <div style={{minHeight:"100vh"}}>
      <SoireePage soirees={data.soireesProto} editMode={editMode} onBack={()=>setPage("home")}
        onUpdate={s=>updArr("soireesProto",s)}
        onAdd={s=>addArr("soireesProto",s)}
        onDelete={id=>delArr("soireesProto",id)}/>
    </div>
  );

  if(page==="idees")return(
    <div style={{minHeight:"100vh"}}>
      <IdeeVracPage value={data.ideeEnVrac} onChange={v=>upd({...data,ideeEnVrac:v})}
        editMode={editMode} onBack={()=>setPage("home")}/>
    </div>
  );

  const sortsByEl={};
  ELEMENTS.forEach(el=>{sortsByEl[el]=data.sorts.filter(s=>s.element===el);});
  const energsByEl={};
  ELEMENTS.forEach(el=>{energsByEl[el]=data.energies.filter(e=>e.element===el);});
  const monsByLvl={};
  LVLS.forEach(l=>{monsByLvl[l]=data.monstres.filter(m=>m.lvl===l);});

  const reglesF=editMode
    ?[...data.regles].sort((a,b)=>STATUTS.indexOf(a.statut)-STATUTS.indexOf(b.statut))
    :data.regles.filter(r=>r.statut==="Validé");
  const casesF=editMode
    ?[...data.cases].sort((a,b)=>STATUTS.indexOf(a.statut)-STATUTS.indexOf(b.statut))
    :data.cases.filter(c=>c.statut==="Validé");

  const bgStyle=editMode
    ?{background:"repeating-linear-gradient(0deg,transparent,transparent 23px,rgba(255,255,255,.025) 23px,rgba(255,255,255,.025) 24px),repeating-linear-gradient(90deg,transparent,transparent 23px,rgba(255,255,255,.025) 23px,rgba(255,255,255,.025) 24px),#111"}
    :{background:"#0e0e0e"};

  const VISUEL_CATS=[
    {key:"general",label:"💡 Idée générale"},
    {key:"boite",label:"📦 Boîte"},
    {key:"personnages",label:"🧑 Personnages"},
    {key:"cases",label:"🗺️ Cases"},
    {key:"items",label:"💎 Items"},
    {key:"monstres",label:"👹 Monstres"},
    {key:"accessoires",label:"🎲 Accessoires"},
    {key:"references",label:"🎨 Références"},
  ];

  return(
    <div style={{minHeight:"100vh",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",color:"#eee",transition:"background .4s",...bgStyle}}>

      {/* HEADER */}
      <div style={{position:"sticky",top:0,zIndex:50,
        background:editMode?"rgba(25,25,25,.97)":"rgba(14,14,14,.97)",
        backdropFilter:"blur(10px)",borderBottom:"1px solid rgba(255,255,255,.06)",
        padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:15,fontWeight:700,color:"#eee"}}>
            <EditText value={data.gameName} onChange={v=>upd({...data,gameName:v})} editMode={editMode}/>
          </div>
          <div style={{fontSize:10,color:saveErr?"#f44":saving?"#888":"#333",marginTop:1}}>
            {saveErr||( saving?"Sauvegarde...":"")}
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setEditMode(!editMode)}
            style={{background:editMode?"rgba(255,255,255,.1)":"none",
              border:`1px solid ${editMode?"rgba(255,255,255,.3)":"#333"}`,
              borderRadius:8,padding:"6px 10px",color:editMode?"#eee":"#666",fontSize:16,transition:"all .2s"}}
            title="Mode édition">✏️</button>
          <button onClick={()=>{localStorage.removeItem("gh_token");setToken("");}}
            style={{background:"none",border:"1px solid #222",borderRadius:8,padding:"6px 10px",color:"#444",fontSize:11}}
            title="Déconnexion">⏻</button>
        </div>
      </div>

      <div style={{padding:"16px 16px 100px"}}>

        {/* JOUER WIP */}
        <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",
          borderRadius:12,padding:16,marginBottom:20,textAlign:"center",opacity:.35,cursor:"not-allowed"}}>
          <div style={{fontSize:14,fontWeight:600,color:"#888"}}>🎮 Jouer</div>
          <div style={{fontSize:11,color:"#555",marginTop:4}}>WIP — bientôt disponible</div>
        </div>

        {/* RÈGLES */}
        <Section title="Règles de base" emoji="📋">
          {reglesF.map(r=>(
            <Card key={r.id} item={r} onUpdate={i=>updArr("regles",i)} onDelete={id=>delArr("regles",id)}
              editMode={editMode} showElem={false}/>
          ))}
          {editMode&&<AddBtn onClick={()=>addArr("regles",{id:uid(),nom:"Nouvelle règle",statut:"Test 3",effet:"",notes:""})}/>}
          <NotesBlock value={data.reglesNotes} onChange={v=>upd({...data,reglesNotes:v})} editMode={editMode} label="Notes globales — Règles"/>
        </Section>

        {/* CASES */}
        <Section title="Cases" emoji="🗺️">
          {casesF.map(c=>(
            <Card key={c.id} item={c} onUpdate={i=>updArr("cases",i)} onDelete={id=>delArr("cases",id)}
              editMode={editMode} showElem={false}/>
          ))}
          {editMode&&<AddBtn onClick={()=>addArr("cases",{id:uid(),nom:"Nouvelle case",statut:"Test 3",effet:"",quantite:1,notes:""})}/>}
        </Section>

        {/* SORTS */}
        <Section title="Sorts" emoji="💎">
          {ELEMENTS.map(el=>(
            <ElemGroup key={el} element={el} items={sortsByEl[el]||[]}
              editMode={editMode} withElem={true}
              onUpdate={i=>updArr("sorts",i)}
              onDelete={id=>delArr("sorts",id)}
              onAdd={i=>addArr("sorts",i)}/>
          ))}
          <NotesBlock value={data.sortsNotes} onChange={v=>upd({...data,sortsNotes:v})} editMode={editMode} label="Notes globales — Sorts"/>
        </Section>

        {/* ÉNERGIES */}
        <Section title="Énergies" emoji="✨">
          {ELEMENTS.map(el=>(
            <ElemGroup key={el} element={el} items={energsByEl[el]||[]}
              editMode={editMode} withElem={false}
              onUpdate={i=>updArr("energies",i)}
              onDelete={id=>delArr("energies",id)}
              onAdd={i=>addArr("energies",{id:uid(),nom:"Nouvelle énergie",element:el,statut:"Test 3",cout:"",limite:"",effet:"",quantite:1,notes:""})}/>
          ))}
        </Section>

        {/* MONSTRES */}
        <Section title="Monstres" emoji="👹">
          {LVLS.map(l=>(
            <LvlGroup key={l} lvl={l} items={monsByLvl[l]||[]}
              editMode={editMode}
              onUpdate={i=>updArr("monstres",i)}
              onDelete={id=>delArr("monstres",id)}
              onAdd={i=>addArr("monstres",i)}/>
          ))}
          <NotesBlock value={data.monstresNotes} onChange={v=>upd({...data,monstresNotes:v})} editMode={editMode} label="Notes globales — Monstres"/>
        </Section>

        {/* LEXIQUE */}
        <Section title="Lexique" emoji="📖">
          {data.lexique.map((l,i)=>(
            <div key={l.id} style={{padding:"8px 0",
              borderBottom:i<data.lexique.length-1?"1px solid rgba(255,255,255,.06)":"none",
              display:"flex",gap:8}}>
              <div style={{minWidth:120,fontSize:12,fontWeight:600,color:"#ccc",flexShrink:0}}>
                <EditText value={l.terme} onChange={v=>{const a=data.lexique.map(x=>x.id===l.id?{...x,terme:v}:x);upd({...data,lexique:a});}} editMode={editMode}/>
              </div>
              <div style={{fontSize:12,color:"#888",flex:1}}>
                <EditText value={l.definition} onChange={v=>{const a=data.lexique.map(x=>x.id===l.id?{...x,definition:v}:x);upd({...data,lexique:a});}} editMode={editMode} multiline/>
              </div>
            </div>
          ))}
          {editMode&&<AddBtn onClick={()=>upd({...data,lexique:[...data.lexique,{id:uid(),terme:"Terme",definition:"Définition"}]})}/>}
          <NotesBlock value={data.lexiqueNotes} onChange={v=>upd({...data,lexiqueNotes:v})} editMode={editMode}/>
        </Section>

        {/* MODES */}
        <Section title="Modes de jeu" emoji="🎮">
          {data.modes.map(m=>(
            <ModeCard key={m.id} mode={m} editMode={editMode}
              onUpdate={m2=>{const a=data.modes.map(x=>x.id===m2.id?m2:x);upd({...data,modes:a});}}/>
          ))}
          {editMode&&<AddBtn onClick={()=>upd({...data,modes:[...data.modes,{id:uid(),nom:"Nouveau mode",emoji:"🎲",difficulte:"⭐",style:"",joueurs:"",contenu:"",notes:""}]})}/>}
          <div style={{marginTop:8,borderTop:"1px solid rgba(255,255,255,.06)",paddingTop:8}}>
            <div style={{fontSize:11,color:"#555",marginBottom:8}}>💡 Idées de modes</div>
            {data.ideesModes.map(im=>(
              <div key={im.id} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:6,padding:"8px 10px",marginBottom:6}}>
                <div style={{fontSize:12,fontWeight:600,color:"#ccc",marginBottom:4}}>
                  <EditText value={im.nom} onChange={v=>{const a=data.ideesModes.map(x=>x.id===im.id?{...x,nom:v}:x);upd({...data,ideesModes:a});}} editMode={editMode}/>
                </div>
                <div style={{fontSize:12,color:"#777"}}>
                  <EditText value={im.pitch} onChange={v=>{const a=data.ideesModes.map(x=>x.id===im.id?{...x,pitch:v}:x);upd({...data,ideesModes:a});}} editMode={editMode} multiline/>
                </div>
              </div>
            ))}
            {editMode&&<AddBtn onClick={()=>upd({...data,ideesModes:[...data.ideesModes,{id:uid(),nom:"Nouveau mode",pitch:""}]})}/>}
          </div>
        </Section>

        {/* VISUELS */}
        <Section title="Visuels" emoji="🎨">
          {VISUEL_CATS.map(cat=>(
            <Section key={cat.key} title={cat.label} emoji="">
              <div style={{fontSize:12,color:"#bbb",lineHeight:1.7}}>
                <EditText value={data.visuels[cat.key]||""} onChange={v=>upd({...data,visuels:{...data.visuels,[cat.key]:v}})} editMode={editMode} multiline/>
              </div>
            </Section>
          ))}
        </Section>

        {/* MATÉRIEL */}
        <Section title="Matériel" emoji="🧰">
          <div style={{fontSize:12,color:"#bbb",lineHeight:1.7}}>
            <EditText value={data.materiel} onChange={v=>upd({...data,materiel:v})} editMode={editMode} multiline/>
          </div>
          <NotesBlock value={data.materielNotes} onChange={v=>upd({...data,materielNotes:v})} editMode={editMode}/>
        </Section>

        {/* BOUTONS */}
        <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:20}}>
          <button onClick={()=>setPage("soirees")}
            style={{width:"100%",background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.1)",
              borderRadius:10,padding:14,color:"#ccc",fontSize:14,fontWeight:600}}>
            📅 Soirées Prototype
          </button>
          <button onClick={()=>setPage("idees")}
            style={{width:"100%",background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.1)",
              borderRadius:10,padding:14,color:"#ccc",fontSize:14,fontWeight:600}}>
            💡 Idées en vrac
          </button>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
