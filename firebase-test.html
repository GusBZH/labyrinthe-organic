<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Test connexion Firebase</title>
<style>
  body { background:#111; color:#eee; font-family:sans-serif; padding:24px; }
  #status { font-size:18px; margin-top:20px; white-space:pre-wrap; }
  .ok { color:#4caf50; }
  .err { color:#f44336; }
</style>
</head>
<body>
<h1>🔥 Test connexion Firebase</h1>
<p>Cette page écrit "coucou" dans la base, le relit, et affiche le résultat. Page de diagnostic temporaire — à supprimer une fois la connexion confirmée.</p>
<div id="status">Connexion en cours…</div>

<script type="module">
  import { db } from "./src/firebase.js";
  import { ref, set, get } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  const statusEl = document.getElementById('status');

  async function run() {
    try {
      const testRef = ref(db, 'test');
      const payload = { message: 'coucou', at: new Date().toISOString() };
      await set(testRef, payload);
      const snapshot = await get(testRef);
      if (snapshot.exists()) {
        statusEl.innerHTML = `<span class="ok">✅ Connexion Firebase OK</span>\n\nValeur écrite puis relue depuis la base :\n${JSON.stringify(snapshot.val(), null, 2)}`;
      } else {
        statusEl.innerHTML = `<span class="err">❌ Écriture OK mais rien lu en retour (bizarre)</span>`;
      }
    } catch (e) {
      statusEl.innerHTML = `<span class="err">❌ Erreur de connexion</span>\n\n${e.message}\n\n${e.stack || ''}`;
    }
  }

  run();
</script>
</body>
</html>
